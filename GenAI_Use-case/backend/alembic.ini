# Alembic configuration. Normally driven from code (app.persistence.database.upgrade), but the CLI
# works too, from the backend/ folder:
#   .venv/Scripts/alembic upgrade head
#   .venv/Scripts/alembic revision --autogenerate -m "describe the change"
[alembic]
script_location = app/persistence/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is taken from APP_DB_URL (.env) unless set here or from code.
